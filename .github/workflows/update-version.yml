# GitHub Action: автоматическое обновление version.json при push в main
# Позволяет уведомлять пользователей о новой версии сайта

name: Update Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.json'
      - '.github/workflows/update-version.yml'

# Один запуск за раз — избегаем гонки и конфликта при push
concurrency:
  group: update-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with main and update version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --rebase origin main
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE=$(date -u +"%Y-%m-%d")
          cat > version.json << 'EOF'
          {
            "version": "TIMESTAMP_PLACEHOLDER",
            "updated": "DATE_PLACEHOLDER"
          }
          EOF
          sed -i "s/TIMESTAMP_PLACEHOLDER/$TIMESTAMP/" version.json
          sed -i "s/DATE_PLACEHOLDER/$DATE/" version.json
          echo "Updated version to $TIMESTAMP"

      - name: Commit and push
        run: |
          git add version.json
          if git diff --staged --quiet; then
            echo "No changes, skip commit"
            exit 0
          fi
          git commit -m "chore: update version.json [skip ci]"
          git push origin main
